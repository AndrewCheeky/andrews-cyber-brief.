<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andrew's Cyber Brief</title><style>body{max-width:760px;margin:60px auto;padding:24px;font:18px system-ui;background:#102234;color:#eff6ff}a{color:#6ee7d0}pre{white-space:pre-wrap;line-height:1.6}</style><h1>Andrew's Cyber Brief</h1><p><a href="briefing.json">Alexa briefing feed</a> · <a href="test.json">Short diagnostic feed</a></p><h2 id="title">Loading latest briefing...</h2><p id="date"></p><pre id="text"></pre><script>fetch('briefing.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{let x=Array.isArray(d)?d[0]:d;document.getElementById('title').textContent=x.titleText;document.getElementById('date').textContent='Published: '+x.updateDate;document.getElementById('text').textContent=x.mainText}).catch(()=>document.getElementById('title').textContent='Briefing unavailable');</script></html>
